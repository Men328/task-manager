# Flow simulator: trang tĩnh trong docs/system/simulator, phục vụ ở cổng 5500.
server {
    listen 5500;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Healthcheck cho docker compose.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
        # Tài liệu sửa thường xuyên: luôn kiểm tra lại để thấy bản mới sau khi rebuild.
        add_header Cache-Control "no-cache";
    }
}
