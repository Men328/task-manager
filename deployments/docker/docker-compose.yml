name: task-manager

# Chạy từ root repo:
#   docker compose -f deployments/docker/docker-compose.yml up --build -d
# hoặc: make up
#
# Build context của mọi service là root repo (`../..`) để Dockerfile copy được
# cả `common/` (module dùng chung) và thư mục service tương ứng.
#
# Mỗi service Go gồm 2 container:
#   <svc>-grpc  -> binary /usr/local/bin/grpc  (gRPC server, nội bộ)
#   <svc>       -> binary /usr/local/bin/http  (grpc-gateway, HTTP nội bộ)
# Gateway dial gRPC qua GRPC_DIAL_ADDR=<svc>-grpc:<port>. Tên service HTTP giữ
# nguyên (`identity`/`task`) để nginx của frontend không phải đổi.
#
# Entrypoint duy nhất: `frontend` (nginx trong image) vừa serve SPA vừa proxy
# /api/<svc>/ sang service Go. FE gọi API same-origin ngay tại port này, nên khi
# đưa ra Internet chỉ có MỘT origin/port — khớp với public hostname của
# Cloudflare Tunnel (cloudflared -> http://frontend:3000).
# Mọi port khác (postgres, *-grpc, gateway) chỉ nằm trong network nội bộ;
# `frontend` bind 127.0.0.1 để không lộ trực tiếp ra host.
# Cloudflare Tunnel nằm sau profile `tunnel` (bật bằng `make up-tunnel`).

services:
  postgres:
    image: postgres:17-alpine
    container_name: tm-postgres
    environment:
      POSTGRES_USER: task_manager
      POSTGRES_PASSWORD: task_manager
      POSTGRES_DB: task_manager
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_manager -d task_manager"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # One-shot: chạy toàn bộ migration rồi thoát.
  migrate:
    image: migrate/migrate:latest
    container_name: tm-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://task_manager:task_manager@postgres:5432/task_manager?sslmode=disable
      - up
    restart: "no"

  # ----------------------------------------------------------------- rustfs
  # Object storage S3-compatible cho hệ thống: mail-provider lưu email gốc (JSON)
  # + attachment. MinIO OSS đã bị archive (dl.min.io ngừng phát hành binary và
  # repo Docker minio/minio + minio/mc bị xoá) nên dùng RustFS — cùng API S3 nên
  # code mail-provider không đổi (vẫn dùng SDK minio-go).
  # API (9000) chỉ nằm trong network nội bộ; console (9001) bind 127.0.0.1 để
  # quản trị từ máy host. Credential đặt trong .env (RUSTFS_ACCESS_KEY/SECRET_KEY).
  # Bucket do mail-provider tự tạo lúc khởi động (EnsureBucket, idempotent).
  rustfs:
    image: rustfs/rustfs:${RUSTFS_VERSION:-latest}
    container_name: tm-rustfs
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: ${RUSTFS_LOG_LEVEL:-error}
    ports:
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfsdata:/data
    healthcheck:
      test: ["CMD", "/usr/bin/curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # ----------------------------------------------------------------- soketi
  # WebSocket server tương thích giao thức Pusher. notification service publish
  # notice vào kênh private `private-noti-internal-<profile_id>`; browser subscribe
  # qua nginx (`/api/soketi/`) và xin chữ ký uỷ quyền ở identity (`/v1/auth/soketi`).
  # Chỉ bind 127.0.0.1 để debug local; traffic thật đi qua nginx của frontend.
  soketi:
    image: ${SOKETI_IMAGE:-quay.io/soketi/soketi:1.6-16-alpine}
    container_name: tm-soketi
    environment:
      SOKETI_DEFAULT_APP_ID: ${SOKETI_APP_ID:-task-manager}
      SOKETI_DEFAULT_APP_KEY: ${SOKETI_APP_KEY:-task-manager}
      SOKETI_DEFAULT_APP_SECRET: ${SOKETI_APP_SECRET:-task-manager-secret}
      SOKETI_DEFAULT_APP_ENABLE_CLIENT_MESSAGES: "false"
      SOKETI_DEFAULT_APP_MAX_CONNECTIONS: "-1"
      SOKETI_METRICS_SERVER_PORT: "9601"
    ports:
      - "127.0.0.1:${SOKETI_PORT:-6001}:6001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9601/usage"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # --------------------------------------------------------------- identity
  identity-grpc:
    build:
      context: ../..
      dockerfile: service/identity/Dockerfile
    container_name: tm-identity-grpc
    entrypoint: ["/usr/local/bin/grpc"]
    environment:
      SERVICE_NAME: identity
      GRPC_ADDR: ":9081"
      LOG_LEVEL: info
      # Repository Postgres: bỏ trống biến này thì identity quay về in-memory stub.
      DATABASE_URL: postgres://task_manager:task_manager@postgres:5432/task_manager?sslmode=disable
      # Khi tạo profile mới, identity gọi task service để tạo bộ status + lifecycle mặc định.
      TASK_GRPC_DIAL_ADDR: "task-grpc:9082"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      task-grpc:
        condition: service_started
    restart: unless-stopped

  identity:
    build:
      context: ../..
      dockerfile: service/identity/Dockerfile
    container_name: tm-identity
    entrypoint: ["/usr/local/bin/http"]
    environment:
      SERVICE_NAME: identity
      HTTP_ADDR: ":8081"
      GRPC_DIAL_ADDR: "identity-grpc:9081"
      LOG_LEVEL: info
      # Đăng nhập Google. Đặt trong deployments/docker/.env (xem .env.example).
      # GOOGLE_REDIRECT_URL phải trùng khít redirect URI đã đăng ký ở Google Cloud
      # Console, và phải trỏ vào chính origin của frontend để nginx proxy tiếp.
      # Mặc định suy ra từ PUBLIC_BASE_URL (một biến duy nhất trong .env).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-${PUBLIC_BASE_URL:-http://localhost:3000}/api/identity/v1/auth/google/callback}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-${PUBLIC_BASE_URL:-http://localhost:3000}}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_TTL: ${SESSION_TTL:-720h}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Gateway identity gọi mail-provider để đăng ký watch Gmail khi user tích
      # quyền đọc mail ở màn đăng nhập.
      MAIL_GRPC_DIAL_ADDR: "mail-provider-grpc:9084"
      # Uỷ quyền subscribe kênh private soketi (`POST /v1/auth/soketi`).
      # App key/secret phải khớp cấu hình service soketi.
      SOKETI_APP_KEY: ${SOKETI_APP_KEY:-task-manager}
      SOKETI_APP_SECRET: ${SOKETI_APP_SECRET:-task-manager-secret}
      SOKETI_CHANNEL_PREFIX: ${SOKETI_CHANNEL_PREFIX:-noti-internal-}
    depends_on:
      identity-grpc:
        condition: service_started
      mail-provider-grpc:
        condition: service_started
      soketi:
        condition: service_healthy
    healthcheck:
      # /healthz chỉ 200 khi gateway gọi được gRPC health service.
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ------------------------------------------------------------------- task
  task-grpc:
    build:
      context: ../..
      dockerfile: service/task/Dockerfile
    container_name: tm-task-grpc
    entrypoint: ["/usr/local/bin/grpc"]
    environment:
      SERVICE_NAME: task
      GRPC_ADDR: ":9082"
      LOG_LEVEL: info
      DATABASE_URL: postgres://task_manager:task_manager@postgres:5432/task_manager?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  task:
    build:
      context: ../..
      dockerfile: service/task/Dockerfile
    container_name: tm-task
    entrypoint: ["/usr/local/bin/http"]
    environment:
      SERVICE_NAME: task
      HTTP_ADDR: ":8082"
      GRPC_DIAL_ADDR: "task-grpc:9082"
      LOG_LEVEL: info
    depends_on:
      task-grpc:
        condition: service_started
    healthcheck:
      # /healthz chỉ 200 khi gateway gọi được gRPC health service.
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # --------------------------------------------------------------- calendar
  calendar-grpc:
    build:
      context: ../..
      dockerfile: service/calendar/Dockerfile
    container_name: tm-calendar-grpc
    entrypoint: ["/usr/local/bin/grpc"]
    environment:
      SERVICE_NAME: calendar
      GRPC_ADDR: ":9083"
      LOG_LEVEL: info
      DATABASE_URL: postgres://task_manager:task_manager@postgres:5432/task_manager?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  calendar:
    build:
      context: ../..
      dockerfile: service/calendar/Dockerfile
    container_name: tm-calendar
    entrypoint: ["/usr/local/bin/http"]
    environment:
      SERVICE_NAME: calendar
      HTTP_ADDR: ":8083"
      GRPC_DIAL_ADDR: "calendar-grpc:9083"
      LOG_LEVEL: info
    depends_on:
      calendar-grpc:
        condition: service_started
    healthcheck:
      # /healthz chỉ 200 khi gateway gọi được gRPC health service.
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ------------------------------------------------------------------ event
  # Sự kiện cá nhân (EVENT.events): giống lịch nhưng có status + source.
  event-grpc:
    build:
      context: ../..
      dockerfile: service/event/Dockerfile
    container_name: tm-event-grpc
    entrypoint: ["/usr/local/bin/grpc"]
    environment:
      SERVICE_NAME: event
      GRPC_ADDR: ":9085"
      LOG_LEVEL: info
      DATABASE_URL: postgres://task_manager:task_manager@postgres:5432/task_manager?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  event:
    build:
      context: ../..
      dockerfile: service/event/Dockerfile
    container_name: tm-event
    entrypoint: ["/usr/local/bin/http"]
    environment:
      SERVICE_NAME: event
      HTTP_ADDR: ":8085"
      GRPC_DIAL_ADDR: "event-grpc:9085"
      LOG_LEVEL: info
    depends_on:
      event-grpc:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------- backlog
  # Nơi mail worker đẩy email không phân loại được (category other).
  backlog-grpc:
    build:
      context: ../..
      dockerfile: service/backlog/Dockerfile
    container_name: tm-backlog-grpc
    entrypoint: ["/usr/local/bin/grpc"]
    environment:
      SERVICE_NAME: backlog
      GRPC_ADDR: ":9086"
      LOG_LEVEL: info
      DATABASE_URL: postgres://task_manager:task_manager@postgres:5432/task_manager?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  backlog:
    build:
      context: ../..
      dockerfile: service/backlog/Dockerfile
    container_name: tm-backlog
    entrypoint: ["/usr/local/bin/http"]
    environment:
      SERVICE_NAME: backlog
      HTTP_ADDR: ":8086"
      GRPC_DIAL_ADDR: "backlog-grpc:9086"
      LOG_LEVEL: info
    depends_on:
      backlog-grpc:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ------------------------------------------------------------ attachment
  # Tệp đính kèm cho task/schedule/event/backlog. Metadata ở Postgres
  # (attachment.attachments), nội dung nhị phân lưu trên RustFS (S3-compatible)
  # tại object_key. Giới hạn ATTACHMENT_MAX_BYTES (mặc định 10 MiB). Gateway có
  # thêm route multipart /v1/attachments/upload + download /v1/attachments/{id}/download.
  attachment-grpc:
    build:
      context: ../..
      dockerfile: service/attachment/Dockerfile
    container_name: tm-attachment-grpc
    entrypoint: ["/usr/local/bin/grpc"]
    environment:
      SERVICE_NAME: attachment
      GRPC_ADDR: ":9089"
      LOG_LEVEL: info
      DATABASE_URL: postgres://task_manager:task_manager@postgres:5432/task_manager?sslmode=disable
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-10485760}
      # Object storage dùng chung với mail-provider (RustFS).
      S3_ENDPOINT: ${S3_ENDPOINT:-rustfs:9000}
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      S3_BUCKET: ${S3_BUCKET:-task-manager}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_TIMEOUT: ${S3_TIMEOUT:-30s}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rustfs:
        condition: service_healthy
    restart: unless-stopped

  attachment:
    build:
      context: ../..
      dockerfile: service/attachment/Dockerfile
    container_name: tm-attachment
    entrypoint: ["/usr/local/bin/http"]
    environment:
      SERVICE_NAME: attachment
      HTTP_ADDR: ":8089"
      GRPC_DIAL_ADDR: "attachment-grpc:9089"
      LOG_LEVEL: info
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-10485760}
    depends_on:
      attachment-grpc:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8089/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------- report
  # Báo cáo: tổng hợp qua task + calendar + event + backlog (không có DB riêng).
  report-grpc:
    build:
      context: ../..
      dockerfile: service/report/Dockerfile
    container_name: tm-report-grpc
    entrypoint: ["/usr/local/bin/grpc"]
    environment:
      SERVICE_NAME: report
      GRPC_ADDR: ":9087"
      LOG_LEVEL: info
      TASK_GRPC_DIAL_ADDR: "task-grpc:9082"
      EVENT_GRPC_DIAL_ADDR: "event-grpc:9085"
      CALENDAR_GRPC_DIAL_ADDR: "calendar-grpc:9083"
      BACKLOG_GRPC_DIAL_ADDR: "backlog-grpc:9086"
    depends_on:
      task-grpc:
        condition: service_started
      event-grpc:
        condition: service_started
      calendar-grpc:
        condition: service_started
      backlog-grpc:
        condition: service_started
    restart: unless-stopped

  report:
    build:
      context: ../..
      dockerfile: service/report/Dockerfile
    container_name: tm-report
    entrypoint: ["/usr/local/bin/http"]
    environment:
      SERVICE_NAME: report
      HTTP_ADDR: ":8087"
      GRPC_DIAL_ADDR: "report-grpc:9087"
      LOG_LEVEL: info
    depends_on:
      report-grpc:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8087/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # --------------------------------------------------------- mail-provider
  # Nhận notice Gmail qua Pub/Sub push -> gọi Gmail API -> DeepSeek -> tạo task.
  # Subscription (refresh token + checkpoint historyId) lưu ở Postgres; bỏ trống
  # DATABASE_URL thì quay về store in-memory (mất khi restart).
  mail-provider-grpc:
    build:
      context: ../..
      dockerfile: service/mail-provider/Dockerfile
    container_name: tm-mail-provider-grpc
    entrypoint: ["/usr/local/bin/grpc"]
    environment:
      SERVICE_NAME: mail-provider
      GRPC_ADDR: ":9084"
      LOG_LEVEL: info
      DATABASE_URL: postgres://task_manager:task_manager@postgres:5432/task_manager?sslmode=disable
      TASK_GRPC_DIAL_ADDR: "task-grpc:9082"
      # Worker phân loại email rồi gọi service tương ứng (schedule/event) và
      # đẩy email "other" sang backlog.
      CALENDAR_GRPC_DIAL_ADDR: "calendar-grpc:9083"
      EVENT_GRPC_DIAL_ADDR: "event-grpc:9085"
      BACKLOG_GRPC_DIAL_ADDR: "backlog-grpc:9086"
      # Sau khi tạo đối tượng thành công, worker đẩy notice sang notification
      # service để nó push qua soketi cho user.
      NOTIFICATION_GRPC_DIAL_ADDR: "notification-grpc:9088"
      # Object storage S3 (RustFS): lưu email gốc + attachment.
      # Bỏ trống S3_ENDPOINT để tắt archive.
      S3_ENDPOINT: ${S3_ENDPOINT:-rustfs:9000}
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      S3_BUCKET: ${S3_BUCKET:-task-manager}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_TIMEOUT: ${S3_TIMEOUT:-30s}
      MAIL_ARCHIVE_ENABLED: ${MAIL_ARCHIVE_ENABLED:-true}
      MAIL_RULE_FALLBACK_ENABLED: ${MAIL_RULE_FALLBACK_ENABLED:-true}
      MAIL_MAX_ATTACHMENTS: ${MAIL_MAX_ATTACHMENTS:-5}
      MAIL_MAX_ATTACHMENT_BYTES: ${MAIL_MAX_ATTACHMENT_BYTES:-10485760}
      # Dùng cùng OAuth client với identity để refresh access token của user.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Topic Pub/Sub đã tạo trong GCP (cùng project với OAuth client).
      MAIL_PUBSUB_TOPIC: ${MAIL_PUBSUB_TOPIC:-}
      MAIL_WATCH_LABEL_IDS: ${MAIL_WATCH_LABEL_IDS:-INBOX}
      MAIL_WATCH_RENEW_INTERVAL: ${MAIL_WATCH_RENEW_INTERVAL:-12h}
      MAIL_WATCH_RENEW_THRESHOLD: ${MAIL_WATCH_RENEW_THRESHOLD:-24h}
      # Pull mode: chỉ chạy khi MAIL_PULL_SUBSCRIPTION được set. Cần credential GCP.
      MAIL_PUBSUB_BASE_URL: ${MAIL_PUBSUB_BASE_URL:-https://pubsub.googleapis.com}
      MAIL_PULL_SUBSCRIPTION: ${MAIL_PULL_SUBSCRIPTION:-}
      MAIL_PULL_MAX_MESSAGES: ${MAIL_PULL_MAX_MESSAGES:-10}
      MAIL_PULL_TIMEOUT: ${MAIL_PULL_TIMEOUT:-2m}
      MAIL_PULL_RETRY_DELAY: ${MAIL_PULL_RETRY_DELAY:-5s}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      MAIL_DEFAULT_PRIORITY: ${MAIL_DEFAULT_PRIORITY:-medium}
      MAIL_QUEUE_SIZE: ${MAIL_QUEUE_SIZE:-256}
      MAIL_WORKER_COUNT: ${MAIL_WORKER_COUNT:-2}
      MAIL_TASK_TIMEOUT: ${MAIL_TASK_TIMEOUT:-15s}
      GMAIL_BASE_URL: ${GMAIL_BASE_URL:-https://gmail.googleapis.com}
      GMAIL_TIMEOUT: ${GMAIL_TIMEOUT:-20s}
      GMAIL_MAX_BODY_BYTES: ${GMAIL_MAX_BODY_BYTES:-32768}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_TIMEOUT: ${DEEPSEEK_TIMEOUT:-60s}
    # Pull mode cần file key service account đọc được từ trong container. Bỏ
    # comment 2 dòng dưới, trỏ GCP_CREDENTIALS_DIR tới thư mục chứa key, rồi đặt
    # GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcp-sa.json trong .env.
    volumes:
      - /root/secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      task-grpc:
        condition: service_started
      calendar-grpc:
        condition: service_started
      event-grpc:
        condition: service_started
      backlog-grpc:
        condition: service_started
      notification-grpc:
        condition: service_started
      rustfs:
        condition: service_healthy
    restart: unless-stopped

  mail-provider:
    build:
      context: ../..
      dockerfile: service/mail-provider/Dockerfile
    container_name: tm-mail-provider
    entrypoint: ["/usr/local/bin/http"]
    environment:
      SERVICE_NAME: mail-provider
      HTTP_ADDR: ":8084"
      GRPC_DIAL_ADDR: "mail-provider-grpc:9084"
      LOG_LEVEL: info
      # Đường dẫn webhook Pub/Sub push; public URL là
      # <PUBLIC_BASE_URL>/api/mail/v1/notifications (nginx bỏ prefix /api/mail).
      MAIL_NOTIFICATION_PATH: ${MAIL_NOTIFICATION_PATH:-/v1/notifications}
      # OIDC do Pub/Sub gắn vào request push. Để trống = bỏ qua xác thực (chỉ dùng khi dev).
      MAIL_PUBSUB_AUDIENCE: ${MAIL_PUBSUB_AUDIENCE:-}
      MAIL_PUBSUB_SERVICE_ACCOUNT: ${MAIL_PUBSUB_SERVICE_ACCOUNT:-}
    depends_on:
      mail-provider-grpc:
        condition: service_started
    healthcheck:
      # /healthz chỉ 200 khi gateway gọi được gRPC health service.
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------- notification
  # Lưu notice của user (notification.notices) và push qua soketi. mail-provider
  # gọi CreateNotice (gRPC nội bộ) sau khi tạo task/lịch/sự kiện/backlog thành công.
  notification-grpc:
    build:
      context: ../..
      dockerfile: service/notification/Dockerfile
    container_name: tm-notification-grpc
    entrypoint: ["/usr/local/bin/grpc"]
    environment:
      SERVICE_NAME: notification
      GRPC_ADDR: ":9088"
      LOG_LEVEL: info
      DATABASE_URL: postgres://task_manager:task_manager@postgres:5432/task_manager?sslmode=disable
      # Publish notice qua REST API của soketi (giao thức Pusher).
      SOKETI_BASE_URL: ${SOKETI_BASE_URL:-http://soketi:6001}
      SOKETI_APP_ID: ${SOKETI_APP_ID:-task-manager}
      SOKETI_APP_KEY: ${SOKETI_APP_KEY:-task-manager}
      SOKETI_APP_SECRET: ${SOKETI_APP_SECRET:-task-manager-secret}
      SOKETI_CHANNEL_PREFIX: ${SOKETI_CHANNEL_PREFIX:-noti-internal-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      soketi:
        condition: service_healthy
    restart: unless-stopped

  notification:
    build:
      context: ../..
      dockerfile: service/notification/Dockerfile
    container_name: tm-notification
    entrypoint: ["/usr/local/bin/http"]
    environment:
      SERVICE_NAME: notification
      HTTP_ADDR: ":8088"
      GRPC_DIAL_ADDR: "notification-grpc:9088"
      LOG_LEVEL: info
      # Gateway xác thực session JWT (HS256) do identity phát hành.
      SESSION_SECRET: ${SESSION_SECRET:-}
    depends_on:
      notification-grpc:
        condition: service_started
    healthcheck:
      # /healthz chỉ 200 khi gateway gọi được gRPC health service.
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # -------------------------------------------------------------- frontend
  # Entrypoint duy nhất: nginx serve SPA + proxy /api/<svc>/ sang các gateway.
  # Chỉ bind 127.0.0.1 để không lộ thẳng ra host; cloudflared đi vào qua
  # network Docker bằng `http://frontend:3000` (nginx listen cả 80 lẫn 3000).
  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        # App key/ws path được nhúng vào bundle lúc build (xem frontend/Dockerfile).
        VITE_SOKETI_APP_KEY: ${SOKETI_APP_KEY:-task-manager}
        VITE_SOKETI_WS_PATH: ${SOKETI_WS_PATH:-/api/soketi}
        VITE_SOKETI_CLUSTER: ${SOKETI_CLUSTER:-mt1}
        VITE_NOTIFICATION_API_URL: ${VITE_NOTIFICATION_API_URL:-/api/notification}
    container_name: tm-frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      identity:
        condition: service_healthy
      task:
        condition: service_healthy
      calendar:
        condition: service_healthy
      event:
        condition: service_healthy
      backlog:
        condition: service_healthy
      attachment:
        condition: service_healthy
      report:
        condition: service_healthy
      mail-provider:
        condition: service_healthy
      notification:
        condition: service_healthy
      soketi:
        condition: service_healthy
    healthcheck:
      # /healthz do nginx trả trực tiếp (xem frontend/nginx.conf).
      # Dùng 127.0.0.1: nginx listen IPv4, còn `localhost` trong container có thể
      # phân giải ra ::1 khiến busybox wget bị "connection refused".
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ----------------------------------------------------------- cloudflared
  # Cloudflare Tunnel: nối public hostname trên Cloudflare Zero Trust vào
  # `http://frontend:3000`. Đặt CLOUDFLARE_TUNNEL_TOKEN trong deployments/docker/.env
  # và bật bằng profile `tunnel` (make up-tunnel). Token truyền qua env
  # TUNNEL_TOKEN để không lộ trong `docker inspect`/ps.
  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-latest}
    container_name: tm-cloudflared
    profiles: ["tunnel"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: ["tunnel", "--no-autoupdate", "run"]
    security_opt:
      - no-new-privileges:true
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  rustfsdata:
