# Nginx phục vụ SPA + proxy /api/<service>/ sang service tương ứng.
# Trong dev, Vite proxy làm việc này (xem frontend/vite.config.ts) — cấu hình
# ở đây giữ đúng hành vi đó cho môi trường Docker.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # identity service (bỏ prefix /api/identity)
    location /api/identity/ {
        proxy_pass http://identity:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # task service (bỏ prefix /api/task)
    location /api/task/ {
        proxy_pass http://task:8082/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
