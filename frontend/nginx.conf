# Nginx phục vụ SPA + proxy /api/<service>/ sang service tương ứng.
#
# Đây là ENTRYPOINT DUY NHẤT của hệ thống: FE luôn gọi API same-origin
# (`/api/...` ngay tại port này), nginx mới forward nội bộ tới các service Go.
# Nhờ vậy khi đưa ra Internet qua Cloudflare Tunnel
# (cloudflared -> http://frontend:3000) chỉ tồn tại một origin/port duy nhất,
# khớp với public hostname cấu hình trên Cloudflare.
#
# Trong dev, Vite proxy làm việc này (xem frontend/vite.config.ts) — cấu hình
# ở đây giữ đúng hành vi đó cho môi trường Docker.

# cloudflared gửi scheme gốc của người dùng qua X-Forwarded-Proto (https).
# Giữ nguyên giá trị đó khi có, còn truy cập trực tiếp thì fallback $scheme.
map $http_x_forwarded_proto $tm_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    # 3000 là port canonical (khớp `http://frontend:3000` cấu hình trên
    # Cloudflare Public Hostname + host mapping của compose); 80 giữ để tương thích.
    listen 80;
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # cloudflared nằm trong network Docker (dải RFC1918) nên tin CF-Connecting-IP
    # để log/forward đúng IP người dùng thay vì IP container.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    # Liveness cho healthcheck của compose/cloudflared.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # identity service (bỏ prefix /api/identity)
    location /api/identity/ {
        proxy_pass http://identity:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $tm_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # task service (bỏ prefix /api/task)
    location /api/task/ {
        proxy_pass http://task:8082/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $tm_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # calendar service (bỏ prefix /api/calendar)
    location /api/calendar/ {
        proxy_pass http://calendar:8083/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $tm_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # event service (bỏ prefix /api/event)
    location /api/event/ {
        proxy_pass http://event:8085/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $tm_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # backlog service (bỏ prefix /api/backlog)
    location /api/backlog/ {
        proxy_pass http://backlog:8086/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $tm_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # report service (bỏ prefix /api/report)
    location /api/report/ {
        proxy_pass http://report:8087/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $tm_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # mail-provider service (bỏ prefix /api/mail)
    # Webhook Pub/Sub push gọi vào /api/mail/v1/notifications; đây là endpoint
    # công khai DUY NHẤT mà Google cần chạm tới.
    location /api/mail/ {
        proxy_pass http://mail-provider:8084/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $tm_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
