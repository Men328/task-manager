syntax = "proto3";

package workspace.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "taskmanager/common/gen/go/workspace/v1;workspacev1";

// Workspace là namespace gốc chứa mọi tài nguyên (task, ... sau này).
// Mapping DB: workspace.WORKSPACES
message Workspace {
  string id = 1;
  string owner_profile_id = 2;
  string name = 3;
  // key ổn định cho API/logic, unique theo owner
  string slug = 4;
  string description = 5;
  // #RRGGBB hoặc #RRGGBBAA
  string color = 6;
  // tên icon hoặc emoji (tuỳ chọn)
  string icon = 7;
  bool is_default = 8;
  int32 position = 9;
  bool is_archived = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  google.protobuf.Timestamp deleted_at = 13;
}

message CreateWorkspaceRequest {
  string owner_profile_id = 1;
  string name = 2;
  string slug = 3;
  string description = 4;
  string color = 5;
  string icon = 6;
  bool is_default = 7;
  int32 position = 8;
}

message CreateWorkspaceResponse {
  Workspace workspace = 1;
}

message GetWorkspaceRequest {
  string id = 1;
}

message GetWorkspaceResponse {
  Workspace workspace = 1;
}

message ListWorkspacesRequest {
  string owner_profile_id = 1;
  bool include_archived = 2;
}

message ListWorkspacesResponse {
  repeated Workspace workspaces = 1;
}

message UpdateWorkspaceRequest {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
  optional string color = 4;
  optional string icon = 5;
  optional bool is_default = 6;
  optional int32 position = 7;
  optional bool is_archived = 8;
}

message UpdateWorkspaceResponse {
  Workspace workspace = 1;
}

service WorkspaceService {
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (CreateWorkspaceResponse) {
    option (google.api.http) = {
      post: "/v1/workspaces"
      body: "*"
    };
  }

  rpc GetWorkspace(GetWorkspaceRequest) returns (GetWorkspaceResponse) {
    option (google.api.http) = {get: "/v1/workspaces/{id}"};
  }

  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse) {
    option (google.api.http) = {get: "/v1/workspaces"};
  }

  rpc UpdateWorkspace(UpdateWorkspaceRequest) returns (UpdateWorkspaceResponse) {
    option (google.api.http) = {
      patch: "/v1/workspaces/{id}"
      body: "*"
    };
  }
}
