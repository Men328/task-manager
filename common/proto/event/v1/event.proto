syntax = "proto3";

package event.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "taskmanager/common/gen/go/event/v1;eventv1";

// Trạng thái nghiệp vụ của 1 sự kiện.
enum EventStatus {
  EVENT_STATUS_UNSPECIFIED = 0;
  // Đã lên kế hoạch, chưa chốt.
  EVENT_STATUS_PLANNED = 1;
  // Đã xác nhận tham dự / đã chốt.
  EVENT_STATUS_CONFIRMED = 2;
  // Đã huỷ.
  EVENT_STATUS_CANCELLED = 3;
}

// Sự kiện (event) cá nhân thuộc 1 profile.
// Khác `schedule` ở chỗ có `status` + `source` để theo dõi sự kiện đến từ email.
// Mapping DB: event.events
message Event {
  string id = 1;
  string profile_id = 2;
  string title = 3;
  string description = 4;
  string location = 5;
  // Thời điểm bắt đầu; bắt buộc.
  google.protobuf.Timestamp start_at = 6;
  // Thời điểm kết thúc; rỗng = không xác định.
  google.protobuf.Timestamp end_at = 7;
  bool all_day = 8;
  // Màu hiển thị `#RRGGBB` / `#RRGGBBAA`; rỗng = màu mặc định của UI.
  string color = 9;
  EventStatus status = 10;
  // Nguồn tạo: rỗng = người dùng tạo trên UI; ngược lại là id email nguồn.
  string source = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

message CreateEventRequest {
  string profile_id = 1;
  string title = 2;
  string description = 3;
  string location = 4;
  google.protobuf.Timestamp start_at = 5;
  google.protobuf.Timestamp end_at = 6;
  bool all_day = 7;
  string color = 8;
  // Bỏ trống = EVENT_STATUS_PLANNED.
  EventStatus status = 9;
  string source = 10;
}

message CreateEventResponse {
  Event event = 1;
}

message GetEventRequest {
  string id = 1;
}

message GetEventResponse {
  Event event = 1;
}

message ListEventsRequest {
  string profile_id = 1;
  // Lọc theo khoảng thời gian (optional): trả sự kiện giao với [from, to).
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  // Lọc theo trạng thái (optional).
  EventStatus status = 4;
}

message ListEventsResponse {
  repeated Event events = 1;
}

message UpdateEventRequest {
  string id = 1;
  optional string title = 2;
  optional string description = 3;
  optional string location = 4;
  // message field đã có presence (nil = không đổi) nên không cần `optional`.
  google.protobuf.Timestamp start_at = 5;
  google.protobuf.Timestamp end_at = 6;
  optional bool all_day = 7;
  optional string color = 8;
  optional EventStatus status = 9;
}

message UpdateEventResponse {
  Event event = 1;
}

message DeleteEventRequest {
  string id = 1;
}

message DeleteEventResponse {}

service EventService {
  rpc CreateEvent(CreateEventRequest) returns (CreateEventResponse) {
    option (google.api.http) = {
      post: "/v1/events"
      body: "*"
    };
  }

  rpc GetEvent(GetEventRequest) returns (GetEventResponse) {
    option (google.api.http) = {get: "/v1/events/{id}"};
  }

  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse) {
    option (google.api.http) = {get: "/v1/events"};
  }

  rpc UpdateEvent(UpdateEventRequest) returns (UpdateEventResponse) {
    option (google.api.http) = {
      patch: "/v1/events/{id}"
      body: "*"
    };
  }

  rpc DeleteEvent(DeleteEventRequest) returns (DeleteEventResponse) {
    option (google.api.http) = {delete: "/v1/events/{id}"};
  }
}
